name: deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE: ghcr.io/demo-org-np-migration/cards-api

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.tag.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: compute short sha tag
        id: tag
        run: echo "sha_tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.sha_tag }}
            ${{ env.IMAGE }}:latest

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: build-push
    runs-on: [self-hosted, cauri-k8s]
    steps:
      - uses: actions/checkout@v4

      - name: helm upgrade (staging)
        run: |
          helm upgrade --install cards-api ./deploy/chart \
            -n staging \
            -f deploy/values-staging.yaml \
            --set image.tag=${{ needs.build-push.outputs.sha_tag }}

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-push
    runs-on: [self-hosted, cauri-k8s]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: helm upgrade (prod)
        run: |
          helm upgrade --install cards-api ./deploy/chart \
            -n prod \
            -f deploy/values-prod.yaml \
            --set image.tag=${{ needs.build-push.outputs.sha_tag }}

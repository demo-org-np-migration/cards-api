replicaCount: 2

env:
  ENV: prod
  LOG_LEVEL: info
  KEYCLOAK_ISSUER: http://keycloak.platform.svc:8080/realms/cauri-prod
  KEYCLOAK_CLIENT_ID: cards-api
  LEDGER_CORE_URL: http://ledger-core.prod.svc:8080
  CARDNET_URL: http://api.cardnet-processor.io

postgresSecret:
  create: false
  name: postgres-credentials
  host: postgres.prod.svc
  port: 5432
  database: cards

keycloakClientSecret:
  name: keycloak-client-cards-api
  key: client_secret

cardnetSecret:
  name: cards-api-secrets
  key: cardnet_api_key

serviceMonitor:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

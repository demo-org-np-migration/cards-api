apiVersion: apps/v1
kind: Deployment
metadata:
  name: cards-api
  labels:
    {{- include "cards-api.labels" . | nindent 4 }}
  annotations:
    # PCI scope: this workload issues cards and runs authorizations against
    # Cardnet — see docs/PCI.md for what that means for who can touch this
    # namespace.
    cauri.io/pci-scope: "true"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cards-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cards-api.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        cauri.io/pci-scope: "true"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: cards-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: {{ include "cards-api.name" . }}
            - name: PORT
              value: "8080"
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloakClientSecret.name }}
                  key: {{ .Values.keycloakClientSecret.key }}
            - name: CARDNET_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cardnetSecret.name }}
                  key: {{ .Values.cardnetSecret.key }}
            # DATABASE_URL is built from DB_USER/DB_PASSWORD via k8s' own
            # $(VAR) env interpolation — both must come before it in this
            # list. It points at `cards`, the database cards-api owns.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresSecret.name }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresSecret.name }}
                  key: password
            # sslmode=disable: postgres.<env>.svc doesn't terminate TLS
            # (in-cluster only). pgx defaults to sslmode=prefer and falls
            # back on its own, but golang-migrate's driver (lib/pq) doesn't
            # — it errors out with "SSL is not enabled on the server"
            # unless told explicitly not to try.
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@{{ .Values.postgresSecret.host }}:{{ .Values.postgresSecret.port }}/{{ .Values.postgresSecret.database }}?sslmode=disable"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

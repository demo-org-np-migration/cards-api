{{- /*
cards-api doesn't manage the Secrets it reads — Terraform creates
`postgres-credentials`, `keycloak-client-cards-api` and `cards-api-secrets`
per environment (see las convenciones internas de API and #4, and this chart's values for
the key names). This template is a no-op in staging and prod
(postgresSecret.create defaults to false).

postgresSecret.create: true is only for a throwaway namespace where nothing
ran Terraform (a local kind cluster, a one-off demo) and you just want the
chart to work end to end. It plants dummy credentials matching whatever
Postgres you point postgresSecret.host at — never use it against a real
`cards`.
*/ -}}
{{- if .Values.postgresSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgresSecret.name }}
  labels:
    {{- include "cards-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: cauri
  password: cauri
{{- end }}

image:
  repository: ghcr.io/demo-org-np-migration/cards-api
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

service:
  port: 8080

# Plain env vars merged onto the container, on top of the ones the chart
# already wires from secrets (KEYCLOAK_CLIENT_SECRET, CARDNET_API_KEY,
# DATABASE_URL — see secret-ref.yaml and deployment.yaml).
env:
  ENV: staging
  LOG_LEVEL: info
  KEYCLOAK_ISSUER: http://keycloak.platform.svc:8080/realms/cauri-staging
  KEYCLOAK_CLIENT_ID: cards-api
  LEDGER_CORE_URL: http://ledger-core:8080
  CARDNET_URL: http://sandbox.cardnet-processor.io

# cards-api owns the `cards` database (las convenciones internas de API).
postgresSecret:
  # Terraform already creates `postgres-credentials` in staging and prod.
  # create:true is only for spinning up a throwaway Secret in an ad-hoc
  # namespace (kind, a demo) where Terraform hasn't run.
  create: false
  name: postgres-credentials
  host: postgres
  port: 5432
  database: cards

keycloakClientSecret:
  name: keycloak-client-cards-api
  key: client_secret

cardnetSecret:
  name: cards-api-secrets
  key: cardnet_api_key

serviceMonitor:
  enabled: true
  interval: 30s

podLabels: {}
podAnnotations: {}
